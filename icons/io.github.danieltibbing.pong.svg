<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04040a" />
      <stop offset="100%" stop-color="#0d0d1e" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ball Gradients -->
    <radialGradient id="ball-red-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#ff4d4f" />
    </radialGradient>
    <radialGradient id="ball-green-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#55efc4" />
      <stop offset="100%" stop-color="#00b894" />
    </radialGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Subtle grid lines in background -->
  <path d="M 0,128 L 512,128 M 0,256 L 512,256 M 0,384 L 512,384 M 128,0 L 128,512 M 256,0 L 256,512 M 384,0 L 384,512" 
        stroke="rgba(255, 255, 255, 0.02)" stroke-width="1.5"/>

  <!-- Bounding Hexagon Outline -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" stroke="rgba(162, 155, 254, 0.15)" stroke-width="2" stroke-linejoin="round" filter="url(#glow-blue)"/>

  <!-- Corner bumpers (pegs) -->
  <circle cx="256" cy="76" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>
  <circle cx="412" cy="166" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>
  <circle cx="412" cy="346" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>
  <circle cx="256" cy="436" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="346" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="166" r="10" fill="#1b1c26" stroke="#ffffff" stroke-width="2"/>

  <!-- Glowing Paddles -->
  <!-- Red Paddle (Top-Left side) -->
  <line x1="130" y1="149" x2="190" y2="114" stroke="#ff7675" stroke-width="14" stroke-linecap="round" filter="url(#glow-red)"/>
  <!-- Green Paddle (Right side) -->
  <line x1="412" y1="210" x2="412" y2="280" stroke="#55efc4" stroke-width="14" stroke-linecap="round" filter="url(#glow-green)"/>
  <!-- Blue Paddle (Bottom-Left side) -->
  <line x1="200" y1="403" x2="140" y2="369" stroke="#74b9ff" stroke-width="14" stroke-linecap="round" filter="url(#glow-blue)"/>

  <!-- Ball 1 + Trail (escaping towards Green Paddle) -->
  <path d="M 180,256 C 240,256 300,256 360,256" fill="none" stroke="rgba(85, 239, 196, 0.15)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="220" cy="256" r="10" fill="#55efc4" opacity="0.2"/>
  <circle cx="270" cy="256" r="13" fill="#55efc4" opacity="0.45"/>
  <circle cx="320" cy="256" r="16" fill="url(#ball-green-grad)" filter="url(#glow-white)"/>

  <!-- Ball 2 + Trail (bouncing off Red Paddle) -->
  <path d="M 230,200 L 175,145" fill="none" stroke="rgba(255, 118, 117, 0.15)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="210" cy="180" r="10" fill="#ff7675" opacity="0.25"/>
  <circle cx="190" cy="160" r="13" fill="#ff7675" opacity="0.5"/>
  <circle cx="170" cy="140" r="16" fill="url(#ball-red-grad)" filter="url(#glow-white)"/>
</svg>
